services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: nexodesk
      POSTGRES_PASSWORD: nexodesk_local
      POSTGRES_DB: nexodesk
    volumes:
      - nexodesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexodesk -d nexodesk"]
      interval: 5s
      retries: 10
volumes:
  nexodesk_pgdata:
